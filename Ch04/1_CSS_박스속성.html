<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1_CSS_박스속성</title>
    <style>
        div {
            display: inline-block;
            width: 100px;
            height: 100px;
            background: orange;
        }

        /* width, height */
        section:nth-of-type(1) > div:nth-child(1) {
            width: 50px;
            height: 50px;
        }

        section:nth-of-type(1) > div:nth-child(2) {
            width: 10%;
            height: 100px;
        }

        section:nth-of-type(1) > div:nth-child(3) {
            width: 50%;
            height: 100px;
        }
        
        /* margin, padding */
        section:nth-of-type(2) > div:nth-child(1) {
            margin: 10px;
            padding: 10px;
        }

        section:nth-of-type(2) > div:nth-child(2) {
            margin: 10px 20px;
            padding: 10px 20px;
        }

        section:nth-of-type(2) > div:nth-child(3) {
            margin: 10px 20px 30px;
            padding: 10px 20px 30px;
        }

        section:nth-of-type(2) > div:nth-child(4) {
            margin: 10px 20px 30px 40px;
            padding: 10px 20px 30px 40px;
        }

        section:nth-of-type(2) > div:nth-child(5) {
            margin-top: 10px;
            margin-right: 20px;
            margin-bottom: 30px;
            margin-left: 40px;
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 30px;
            padding-left: 40px;
        }

        section:nth-of-type(2) > div:nth-child(6) {
            display: block;
            margin: 0 auto; /* block 형식 태그를 가운데 정렬 */
        }
        
        /* border */
        section:nth-of-type(3) > div:nth-child(1) {
            border: 1px solid black;
        }

        section:nth-of-type(3) > div:nth-child(2) {
            border: 5px dashed blue;
        }
        
        section:nth-of-type(3) > div:nth-child(3) {
            border: 3px dotted green;
        }
        
        /* box-sizing : 고정된 크기(width, height)에서 안쪽, 테두리 여백 처리 */
        section:nth-of-type(4) > div:nth-child(1) {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            box-sizing: border-box;
        }

        section:nth-of-type(4) > div:nth-child(2) {
            width: 100px;
            height: 100px;
            padding: 10px;
            border: 1px solid black;
            box-sizing: border-box;
        }
        
        section:nth-of-type(4) > div:nth-child(3) {
            width: 100px;
            height: 100px;
            margin: 10px;
            padding: 6px;
            border: 2px solid black;
            box-sizing: border-box;
        }


    </style>
</head>
<body>
    <h3>1.CSS 박스속성</h3>

    <h4>width, height</h4>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>

    <h4>margin, padding</h4>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </section>
    
    <h4>border</h4>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>
    
    <h4>box-sizing</h4>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>




</body>
</html>
